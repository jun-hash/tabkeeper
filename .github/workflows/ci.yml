name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install tmux for the end-to-end test
        run: ${{ runner.os == 'Linux' && 'sudo apt-get install -y tmux' || 'brew install tmux' }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test
      - run: bun run compile && ./release/tabkeeper --help

  node:
    name: npm package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node dist/cli/main.js --help
      - run: node -e "import('./dist/index.js').then((m) => { if (typeof m.plan !== 'function') process.exit(1) })"
